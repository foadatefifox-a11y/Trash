<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>trashiseeintrashydays</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100svh;
      margin: 0; background: #000; color: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; gap: 2rem; padding: 8svh 0 4svh;
    }
    .letters { position: relative; width: 90%; }
    .letters img { display: block; }
    .letter-art { width: 100%; height: auto; }
    .alternate-a {
      position: absolute; top: 0; left: 39.24855%; width: 23.06358%; height: auto;
      opacity: 0; pointer-events: none;
      animation: blink-a 4s steps(1, end) infinite;
    }
    @keyframes blink-a {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .letter-link {
      position: absolute; inset-block: 0; left: var(--left); width: var(--width);
      color: #fff; display: grid; place-items: center; text-decoration: none;
    }
    .letter-link:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
    .letter-label {
      opacity: 0; pointer-events: none;
      padding: .35em .6em; border: 1px solid #fff; border-radius: .2em;
      background: #000; color: #fff; white-space: nowrap;
      font: 600 clamp(.75rem, 2vw, 1.125rem)/1.25 Arial, sans-serif;
    }
    .letter-link:hover .letter-label, .letter-link:focus-visible .letter-label { opacity: 1; }
    .quote { display: block; width: clamp(16rem, 51%, 61rem); max-width: 90%; height: auto; }
  </style>
</head>
<body>
  <nav class="letters" aria-label="Trash editions">
    <img class="letter-art" src="images/trash-letters.webp" alt="TRASH" width="1730" height="479">
    <img class="alternate-a" src="images/trash-a-outline.webp" alt="" width="399" height="479">
    <a class="letter-link" style="--left: 0%; --width: 20.7%" href="edities/01.html"><span class="letter-label">Trashy Text</span></a>
    <a class="letter-link" style="--left: 20.7%; --width: 18.55%" href="edities/02.html"><span class="letter-label">Trashy Photos</span></a>
    <a class="letter-link" style="--left: 39.25%; --width: 23.2%" href="edities/03.html"><span class="letter-label">Trashy Screens</span></a>
    <a class="letter-link" style="--left: 62.45%; --width: 16.7%" href="edities/04.html"><span class="letter-label">Trashy Design</span></a>
  </nav>
  <img class="quote" src="images/trash-quote.webp" alt="One man's rubbish may be another's treasure" width="972" height="96">
</body>
</html>
