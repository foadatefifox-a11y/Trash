<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het scherm</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #000; }
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      padding: min(6vw, 5vh, 3rem);
      padding: min(6vw, 5svh, 3rem);
      background: #000;
      color: #fff;
    }
    .materials {
      width: 100%;
      max-width: 72rem;
      display: grid;
      justify-items: center;
      gap: min(10vh, 5rem);
      gap: min(10svh, 5rem);
    }
    .material {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 0.15em 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-weight: 900;
      font-size: min(16vw, 18vh, 9rem);
      font-size: min(16vw, 18svh, 9rem);
      line-height: 1.15;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .material span {
      display: block;
      transition: filter 220ms ease;
      pointer-events: none;
    }
    .material[aria-pressed="false"] span {
      filter: blur(clamp(1.5px, 0.6vw, 4px));
    }
    .material:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 4px;
    }
    @supports (-webkit-text-stroke: 1px white) {
      .material span {
        color: transparent;
        -webkit-text-stroke: 0.1px #fff;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .material span { transition: none; }
    }
    .sound-status {
      position: fixed;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 1rem;
      right: 1rem;
      margin: 0;
      text-align: center;
      color: #aaa;
      font: 0.75rem/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="materials" aria-label="Choose a material">
    <button class="material" data-material="plastic" type="button" aria-pressed="true"><span>plastic</span></button>
    <button class="material" data-material="paper" type="button" aria-pressed="false"><span>paper</span></button>
  </main>
  <p class="sound-status" role="status">Tap a word to enable sound, then resize the window or rotate your phone.</p>
  <script>
    const materials = document.querySelectorAll('.material');
    const status = document.querySelector('.sound-status');
    const buffers = new Map();
    let context;
    let selected = 'plastic';
    let source = null;
    let playingKey = null;
    let direction = null;
    let resizing = false;
    let stopTimer;
    let width = window.innerWidth;
    let loading;
    const landscape = window.matchMedia('(orientation: landscape)');
    const touchScreen = window.matchMedia('(hover: none) and (pointer: coarse)');
    let wasLandscape = landscape.matches;

    function stopSound() {
      if (source) {
        source.stop();
        source.disconnect();
        source = null;
      }
      playingKey = null;
    }

    function playSound(rotation = false) {
      if (!context || context.state !== 'running' || (!resizing && !rotation) || !direction) return;
      const key = selected + '-' + direction;
      if (!rotation && key === playingKey && source) {
        source.stop(context.currentTime + 0.075);
        return;
      }
      stopSound();
      const buffer = buffers.get(key);
      if (!buffer) return;
      source = context.createBufferSource();
      source.buffer = buffer;
      source.loop = !rotation;
      const gain = context.createGain();
      gain.gain.value = direction === 'outside' ? 1.3 : 1;
      source.connect(gain);
      gain.connect(context.destination);
      source.start();
      // Audio-clock expiry still works if native window dragging blocks JS timers.
      if (!rotation) source.stop(context.currentTime + 0.075);
      const currentSource = source;
      currentSource.onended = () => {
        currentSource.disconnect();
        gain.disconnect();
        if (source === currentSource) {
          source = null;
          playingKey = null;
        }
      };
      playingKey = key;
    }

    async function enableSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error('Audio unavailable');
        if (!context) context = new AudioContextClass();
        await context.resume();
        if (!loading) {
          status.textContent = 'Loading sounds…';
          loading = Promise.all(['plastic-inside', 'plastic-outside', 'paper-inside', 'paper-outside'].map(async key => {
            const response = await fetch('../audio/' + key + '.m4a' + (key.startsWith('plastic-') ? '?v=recap-1' : ''));
            if (!response.ok) throw new Error('Sound could not load');
            buffers.set(key, await context.decodeAudioData(await response.arrayBuffer()));
          })).catch(error => { buffers.clear(); loading = null; throw error; });
        }
        await loading;
        status.textContent = '';
      } catch (error) {
        stopSound();
        status.textContent = 'Sound could not load. Tap a word to try again.';
      }
    }

    materials.forEach(button => {
      button.addEventListener('click', () => {
        selected = button.dataset.material;
        resizing = false;
        clearTimeout(stopTimer);
        stopSound();
        materials.forEach(material => {
          material.setAttribute('aria-pressed', String(material === button));
        });
        enableSound();
      });
    });

    function handleOrientation() {
      const nextLandscape = landscape.matches;
      if (nextLandscape === wasLandscape) return;
      wasLandscape = nextLandscape;
      if (!touchScreen.matches) return;
      resizing = false;
      clearTimeout(stopTimer);
      stopSound();
      direction = nextLandscape ? 'outside' : 'inside';
      // Rotation is a discrete gesture: play the recording once, never loop it.
      playSound(true);
    }
    if (landscape.addEventListener) {
      landscape.addEventListener('change', handleOrientation);
    } else {
      landscape.addListener(handleOrientation);
    }

    window.addEventListener('resize', () => {
      if (touchScreen.matches) {
        width = window.innerWidth;
        handleOrientation();
        return;
      }
      const nextWidth = window.innerWidth;
      const dx = nextWidth - width;
      if (dx === 0) return;
      direction = dx < 0 ? 'inside' : 'outside';
      width = nextWidth;
      resizing = true;
      playSound();
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => {
        resizing = false;
        stopSound();
      }, 75);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        resizing = false;
        clearTimeout(stopTimer);
        stopSound();
      }
    });
    window.addEventListener('pagehide', stopSound);
  </script>
</body>
</html>
