<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het scherm</title>
  <style>
    * { box-sizing: border-box; }
    html {
      margin: 0;
      background: #000;
    }
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: min(4vw, 4vh, 2rem);
      padding: min(4vw, 4dvh, 2rem);
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
    }
    .materials {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: min(8vh, 6rem);
      gap: min(8dvh, 6rem);
      width: 100%;
      text-align: center;
    }
    .materials p {
      margin: 0;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-weight: 900;
      font-size: min(12vw, 20vh, 9rem);
      font-size: min(12vw, 20dvh, 9rem);
      line-height: 1.1;
      text-transform: uppercase;
      white-space: nowrap;
    }
    @supports (-webkit-text-stroke: 1px white) {
      .materials p {
        color: transparent;
        -webkit-text-stroke: 0.1px #fff;
      }
    }
  </style>
</head>
<body>
  <main class="materials" aria-label="Materials">
    <p>plastic</p>
    <p>paper</p>
  </main>
</body>
</html>
