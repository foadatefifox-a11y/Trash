<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het scherm</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; }
    .materials { width: 100%; height: 100vh; height: 100svh; }
    .material {
      position: fixed; left: 0; width: 100%;
      display: grid; place-items: center;
      margin: 0; padding: 0; border: 0;
      background: transparent; color: #fff;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .material[aria-pressed="true"] { top: 0; height: 90vh; height: 90svh; }
    .material[aria-pressed="false"] { bottom: 0; height: 10vh; height: 10svh; }
    .material span { display: block; pointer-events: none; transition: filter 220ms ease; }
    .material[aria-pressed="false"] span { filter: blur(1.5px); }
    .material svg { display: block; overflow: visible; }
    .material[aria-pressed="true"] svg {
      width: 90vw;
      height: calc(90vh - 2rem);
      height: calc(90svh - 2rem);
    }
    .material text {
      font: 900 100px Arial, Helvetica, sans-serif;
      fill: none; stroke: #fff; stroke-width: 0.65px;
      vector-effect: non-scaling-stroke;
    }
    .material:focus-visible { outline: 1px solid #fff; outline-offset: -4px; }
    .sound-status {
      position: fixed; bottom: 0.15rem; left: 1rem; right: 1rem;
      margin: 0; text-align: center; color: #aaa;
      font: 0.65rem/1.2 system-ui, sans-serif; pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) { .material span { transition: none; } }
  </style>
</head>
<body>
  <main class="materials" aria-label="Choose a material">
    <button class="material" data-material="plastic" type="button" aria-label="Plastic" aria-pressed="true"><span><svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><text>PLASTIC</text></svg></span></button>
    <button class="material" data-material="paper" type="button" aria-label="Paper" aria-pressed="false"><span><svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><text>PAPER</text></svg></span></button>
  </main>
  <p class="sound-status" role="status">Tap a word to enable sound, then resize the window or rotate your phone.</p>
  <script>
    const materials = document.querySelectorAll('.material');
    const status = document.querySelector('.sound-status');
    const buffers = new Map();
    let context;
    let selected = 'plastic';
    let source = null;
    let playingKey = null;
    let direction = null;
    let resizing = false;
    let stopTimer;
    let width = window.innerWidth;
    let loading;
    const landscape = window.matchMedia('(orientation: landscape)');
    const touchScreen = window.matchMedia('(hover: none) and (pointer: coarse)');
    let wasLandscape = landscape.matches;

    const glyphContext = document.createElement('canvas').getContext('2d');
    function updateTypography() {
      materials.forEach(button => {
        const svg = button.querySelector('svg');
        const text = button.querySelector('text');
        glyphContext.font = '900 100px Arial, Helvetica, sans-serif';
        const metrics = glyphContext.measureText(text.textContent);
        const box = {
          x: -metrics.actualBoundingBoxLeft,
          y: -metrics.actualBoundingBoxAscent,
          width: metrics.actualBoundingBoxLeft + metrics.actualBoundingBoxRight,
          height: metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent
        };
        svg.setAttribute('viewBox', [box.x, box.y, box.width, box.height].join(' '));
        if (button.getAttribute('aria-pressed') === 'false') {
          // Fixed 24px lettering, independent of the window size.
          svg.style.width = box.width * 0.24 + 'px';
          svg.style.height = box.height * 0.24 + 'px';
        } else {
          svg.style.removeProperty('width');
          svg.style.removeProperty('height');
        }
      });
    }
    updateTypography();
    if (document.fonts) document.fonts.ready.then(updateTypography);

    function stopSound() {
      if (source) {
        source.stop();
        source.disconnect();
        source = null;
      }
      playingKey = null;
    }

    function playSound(rotation = false) {
      if (!context || context.state !== 'running' || (!resizing && !rotation) || !direction) return;
      const key = selected + '-' + direction;
      if (!rotation && key === playingKey && source) {
        source.stop(context.currentTime + 0.075);
        return;
      }
      stopSound();
      const buffer = buffers.get(key);
      if (!buffer) return;
      source = context.createBufferSource();
      source.buffer = buffer;
      source.loop = !rotation;
      const gain = context.createGain();
      gain.gain.value = direction === 'outside' ? 1.3 : 1;
      source.connect(gain);
      gain.connect(context.destination);
      source.start();
      // Audio-clock expiry still works if native window dragging blocks JS timers.
      if (!rotation) source.stop(context.currentTime + 0.075);
      const currentSource = source;
      currentSource.onended = () => {
        currentSource.disconnect();
        gain.disconnect();
        if (source === currentSource) {
          source = null;
          playingKey = null;
        }
      };
      playingKey = key;
    }

    async function enableSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error('Audio unavailable');
        if (!context) context = new AudioContextClass();
        await context.resume();
        if (!loading) {
          status.textContent = 'Loading sounds…';
          loading = Promise.all(['plastic-inside', 'plastic-outside', 'paper-inside', 'paper-outside'].map(async key => {
            const response = await fetch('../audio/' + (key.startsWith('plastic-') ? key + '-recap-v2' : key) + '.m4a', { cache: 'no-store' });
            if (!response.ok) throw new Error('Sound could not load');
            buffers.set(key, await context.decodeAudioData(await response.arrayBuffer()));
          })).catch(error => { buffers.clear(); loading = null; throw error; });
        }
        await loading;
        status.textContent = '';
      } catch (error) {
        stopSound();
        status.textContent = 'Sound could not load. Tap a word to try again.';
      }
    }

    materials.forEach(button => {
      button.addEventListener('click', () => {
        selected = button.dataset.material;
        resizing = false;
        clearTimeout(stopTimer);
        stopSound();
        materials.forEach(material => {
          material.setAttribute('aria-pressed', String(material === button));
        });
        updateTypography();
        enableSound();
      });
    });

    function handleOrientation() {
      const nextLandscape = landscape.matches;
      if (nextLandscape === wasLandscape) return;
      wasLandscape = nextLandscape;
      if (!touchScreen.matches) return;
      resizing = false;
      clearTimeout(stopTimer);
      stopSound();
      direction = nextLandscape ? 'outside' : 'inside';
      // Rotation is a discrete gesture: play the recording once, never loop it.
      playSound(true);
    }
    if (landscape.addEventListener) {
      landscape.addEventListener('change', handleOrientation);
    } else {
      landscape.addListener(handleOrientation);
    }

    window.addEventListener('resize', () => {
      updateTypography();
      if (touchScreen.matches) {
        width = window.innerWidth;
        handleOrientation();
        return;
      }
      const nextWidth = window.innerWidth;
      const dx = nextWidth - width;
      if (dx === 0) return;
      direction = dx < 0 ? 'inside' : 'outside';
      width = nextWidth;
      resizing = true;
      playSound();
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => {
        resizing = false;
        stopSound();
      }, 75);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        resizing = false;
        clearTimeout(stopTimer);
        stopSound();
      }
    });
    window.addEventListener('pagehide', stopSound);
  </script>
</body>
</html>
