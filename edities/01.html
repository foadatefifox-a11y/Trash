<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het scherm</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      background: #000;
    }
    * { box-sizing: border-box; }
    body {
      color: #fff;
      padding: clamp(1rem, 4vw, 4rem);
    }
    .materials {
      display: flex;
      flex-direction: column;
      gap: clamp(2rem, 8vh, 6rem);
      max-width: 72rem;
      margin-inline: auto;
    }
    .materials p {
      margin: 0;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 12vw, 9rem);
      line-height: 1.1;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }
    @supports (-webkit-text-stroke: 1px white) {
      .materials p {
        color: transparent;
        -webkit-text-stroke: 0.1px #fff;
      }
    }
  </style>
</head>
<body>
  <main class="materials" aria-label="Materials">
    <p>plastic</p>
    <p>paper</p>
  </main>
</body>
</html>
