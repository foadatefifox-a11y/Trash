<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het scherm</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #000; }
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      padding: min(6vw, 5vh, 3rem);
      padding: min(6vw, 5svh, 3rem);
      background: #000;
      color: #fff;
    }
    .materials {
      width: 100%;
      max-width: 72rem;
      display: grid;
      justify-items: center;
      gap: min(10vh, 5rem);
      gap: min(10svh, 5rem);
    }
    .material {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 0.15em 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-weight: 900;
      font-size: min(16vw, 18vh, 9rem);
      font-size: min(16vw, 18svh, 9rem);
      line-height: 1.15;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .material span {
      display: block;
      transition: filter 220ms ease;
      pointer-events: none;
    }
    .material[aria-pressed="false"] span {
      filter: blur(clamp(4px, 1.8vw, 12px));
    }
    .material:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 4px;
    }
    @supports (-webkit-text-stroke: 1px white) {
      .material span {
        color: transparent;
        -webkit-text-stroke: 0.1px #fff;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .material span { transition: none; }
    }
  </style>
</head>
<body>
  <main class="materials" aria-label="Choose a material">
    <button class="material" type="button" aria-pressed="true"><span>plastic</span></button>
    <button class="material" type="button" aria-pressed="false"><span>paper</span></button>
  </main>
  <script>
    const materials = document.querySelectorAll('.material');
    materials.forEach(button => {
      button.addEventListener('click', () => {
        materials.forEach(material => {
          material.setAttribute('aria-pressed', String(material === button));
        });
      });
    });
  </script>
</body>
</html>
