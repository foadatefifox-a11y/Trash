<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="../images/dirty-paper-open.webp" as="image">
  <title>trashy photos | trashiseeintrashydays</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ball: clamp(44px, 7vmin, 76px); }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { background: #2c211d url('../images/trashy-photos-brick-wall-retouched.webp') center / cover no-repeat; }
    .photo-piece {
      position: fixed; z-index: 5;
      width: var(--ball); height: var(--ball);
      padding: 0; border: 0;
      background: transparent url('../images/dirty-paper-closed.webp') center / contain no-repeat;
      transform: translate(-50%, -50%) rotate(var(--spin, 0deg));
      cursor: grab; touch-action: none; user-select: none;
    }
    button.photo-piece { left: 50%; top: 83%; }
    button.photo-piece:active { cursor: grabbing; }
    button.photo-piece:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }
    .photo-pile { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .landed-photo {
      position: absolute;
      width: var(--land-size); aspect-ratio: 569 / 580;
      transform: translate(-50%, -50%);
    }
    .landed-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .landed-photo .closed-paper { width: var(--ball); height: var(--ball); inset: 50% auto auto 50%; translate: -50% -50%; }
    .aim-guide { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
    .aim-path { fill: none; stroke: #fff9; stroke-width: 1.5px; stroke-dasharray: 3 8; }
  </style>
</head>
<body>
  <div class="photo-pile" aria-label="Thrown paper"></div>
  <svg class="aim-guide" aria-hidden="true"><path class="aim-path"></path></svg>
  <button class="photo-piece" type="button" aria-label="Throw paper. Drag back and release, or use the arrow keys to aim and Enter to throw."></button>
  <script src="../photos-game.js?v=dirty-paper-1"></script>
</body>
</html>
