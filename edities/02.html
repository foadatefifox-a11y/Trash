<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het beeld</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .can-band {
      position: fixed; left: 0; width: 100%;
      top: 30vh; height: 50vh;
      top: 30svh; height: 50svh;
    }
    .trashcan {
      position: absolute; left: 0; top: 50%;
      width: min(40.76923077vh, var(--can-width-limit));
      width: min(40.76923077svh, var(--can-width-limit));
      margin: 0;
      transform: translate3d(0, -50%, 0);
      will-change: transform;
    }
    .trashcan img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="can-band" aria-label="Prullenbak">
    <figure class="trashcan"><img src="../trashcan.svg?v=white-outlines-2" alt="Prullenbak" width="212" height="260"></figure>
  </main>
  <script>
    const can = document.querySelector('.trashcan');
    // Keep the initial width limit: squeezing the window must not shrink the can.
    can.style.setProperty('--can-width-limit', window.innerWidth * 0.7 + 'px');
    let x = Math.max(0, (window.innerWidth - can.getBoundingClientRect().width) / 2);
    let direction = -1;
    let lastTime = null;
    function animate(time) {
      const elapsed = lastTime === null ? 0 : Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;
      const canWidth = can.getBoundingClientRect().width;
      const limit = window.innerWidth - canWidth;
      const speed = Math.max(96, window.innerWidth * 0.3);
      if (limit <= 0) {
        x = limit / 2;
        can.style.transform = 'translate3d(' + x + 'px, -50%, 0)';
        requestAnimationFrame(animate);
        return;
      }
      x += direction * speed * elapsed;
      if (x <= 0) {
        x = 0;
        direction = 1;
      } else if (x >= limit) {
        x = limit;
        direction = -1;
      }
      can.style.transform = 'translate3d(' + x + 'px, -50%, 0)';
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    window.addEventListener('resize', () => {
      x = Math.min(x, Math.max(0, window.innerWidth - can.getBoundingClientRect().width));
    });
  </script>
</body>
</html>
