<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Het beeld</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .can-band {
      position: fixed; left: 0; width: 100%;
      top: 30vh; height: 50vh;
      top: 30svh; height: 50svh;
    }
    .trashcan {
      position: absolute; left: 1rem; top: 50%;
      width: min(40.76923077vh, 70vw);
      width: min(40.76923077svh, 70vw);
      margin: 0;
      animation: drift 5s linear infinite alternate;
      will-change: transform;
    }
    .trashcan img { display: block; width: 100%; height: auto; }
    @keyframes drift {
      from { transform: translate(0, -50%); }
      to { transform: translate(calc(100vw - 100% - 2rem), -50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trashcan { animation: none; left: 50%; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>
  <main class="can-band" aria-label="Prullenbak">
    <figure class="trashcan"><img src="../trashcan.svg?v=white-outlines-2" alt="Prullenbak" width="212" height="260"></figure>
  </main>
</body>
</html>
